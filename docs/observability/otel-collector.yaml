# OpenTelemetry Collector config for the Shop API. See docs/opentelemetry.md.
#
#   API --OTLP--> Collector --+-- logs, traces, metrics --> otel-lgtm (Grafana)
#                             +-- traces -----------------> Seq
#
# Seq only gets traces here because it already receives logs from the Serilog Seq sink.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuses data instead of running out of memory. Keep this first.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Sends telemetry in groups instead of one item at a time.
  batch: {}

exporters:
  # Hostnames are the container names on the shared Docker network.
  otlp_grpc/grafana:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true
  otlp_http/seq:
    endpoint: http://seq:80/ingest/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/grafana, otlp_http/seq]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/grafana]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/grafana]
